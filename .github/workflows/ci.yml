name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: LTM_CI（ubuntu / arm-none-eabi）
    runs-on: ubuntu-latest
    env:
      LTM_CMAKE_GENERATOR: Unix Makefiles
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make gcc gcc-arm-none-eabi

      - name: 构建 + 主机测试
        run: python3 tools/ci.py

      - name: 失败时上传 map 与日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-maps
          path: |
            **/build/**/*.map
            **/build/**/*.log
          if-no-files-found: ignore
