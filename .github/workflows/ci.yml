name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: LTM_CI（ubuntu / GNU Arm Embedded）
    runs-on: ubuntu-latest
    env:
      LTM_CMAKE_GENERATOR: Unix Makefiles
    steps:
      - uses: actions/checkout@v4

      # 工具链准备 + 构建 + 主机测试都在脚本里（与 Gitee 流水线共用同一份）
      - name: 引导工具链 + 构建 + 主机测试
        run: bash tools/ci_bootstrap.sh

      - name: 失败时上传 map 与日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-maps
          path: |
            **/build/**/*.map
            **/build/**/*.log
          if-no-files-found: ignore
